<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="920" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">quota-gate - admission decision</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">A call must clear every limit across global, tenant and user scopes at once; the longest retry_after decides.</text><rect x="60" y="214" width="300" height="92" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(76,229) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g><text x="106" y="245" font-size="16.5" font-weight="700" fill="#17509f">Model call</text><text x="77" y="267.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">model + est. max_tokens</text><text x="77" y="284.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tenant, user</text><rect x="60" y="340" width="300" height="92" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(76,355) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="106" y="371" font-size="16.5" font-weight="700" fill="#136b74">Sliding windows</text><text x="77" y="393.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">bucketed counters</text><text x="77" y="410.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one per scope key</text><rect x="410" y="158" width="560" height="372" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="428" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">EVERY APPLICABLE RULE MUST CLEAR</text><rect x="432" y="190" width="516" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(448,205) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="478" y="221" font-size="16.5" font-weight="700" fill="#17509f">Global - the fleet</text><text x="449" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">key = (model)</text><text x="449" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">1M tokens / 60s</text><rect x="432" y="290" width="516" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(448,305) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/><path d="M16 5.2A3.4 3.4 0 0 1 16 11"/><path d="M18 13.9c2.4.6 4 2.5 4 5.1"/></g><text x="478" y="321" font-size="16.5" font-weight="700" fill="#552fae">Tenant - one customer</text><text x="449" y="343.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">key = (tenant, model)</text><text x="449" y="360.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">60k tokens + 500 req / 60s</text><rect x="432" y="390" width="516" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(448,405) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="478" y="421" font-size="16.5" font-weight="700" fill="#136b74">User - one person</text><text x="449" y="443.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">key = (tenant, user, model)</text><text x="449" y="460.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">40 requests / 3h</text><path d="M360,260 L408,260" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="351.248" y="248.0" width="65.50399999999999" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="384.0" y="264.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">the call</text><path d="M360,386 L408,386" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="338.936" y="374.0" width="90.128" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="384.0" y="390.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">used so far</text><rect x="1000" y="286" width="212" height="118" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1094.0,300) scale(1.0000)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1106.0" y="344" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">Toughest wins</text><text x="1106.0" y="365.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ranked by retry_after</text><text x="1106.0" y="382.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">longest wait trips</text><path d="M970,345 L998,345" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="939.512" y="333.0" width="88.976" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="984.0" y="349.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">check each</text><rect x="1280" y="226" width="250" height="92" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1296,241) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1326" y="257" font-size="16.5" font-weight="700" fill="#186547">Admit</text><text x="1297" y="279.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">record in every window</text><text x="1297" y="296.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">return remaining</text><rect x="1280" y="372" width="250" height="114" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1296,387) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="1326" y="403" font-size="16.5" font-weight="700" fill="#9e2b36">Deny early</text><text x="1297" y="425.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">retry_after to sleep on</text><text x="1297" y="442.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">which rule + scope, why</text><text x="1297" y="460.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">optional cheaper fallback</text><path d="M1212,330 L1231.0,330.0 Q1246,330 1246.0,315.0 L1246.0,287.0 Q1246,272 1261.0,272.0 L1280,272" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1206.048" y="288.0" width="79.904" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1246" y="304.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">clears all</text><path d="M1212,360 L1231.0,360.0 Q1246,360 1246.0,375.0 L1246.0,414.0 Q1246,429 1261.0,429.0 L1280,429" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="1201.512" y="388.0" width="88.976" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1246" y="404.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">any breach</text><rect x="60" y="576" width="1440" height="150" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="78" y="567" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">RESERVE THEN RECONCILE AFTER THE CALL</text><rect x="90" y="608" width="380" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(106,623) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="136" y="639" font-size="16.5" font-weight="700" fill="#552fae">Reserve up front</text><text x="107" y="661.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">hold the estimated max_tokens</text><text x="107" y="678.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a big completion counts now</text><rect x="566" y="608" width="320" height="87" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(582,623) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="612" y="639" font-size="16.5" font-weight="700" fill="#3d4a63">Make the call</text><text x="583" y="661.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">send to the provider</text><text x="583" y="678.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">read the actual usage</text><rect x="982" y="608" width="478" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(998,623) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="1028" y="639" font-size="16.5" font-weight="700" fill="#17509f">Commit or refund</text><text x="999" y="661.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">commit -&gt; reconcile to actual tokens</text><text x="999" y="678.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">refund -&gt; free a failed call entirely</text><path d="M470,651 L566,651" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="479.2" y="639.0" width="77.6" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="518.0" y="655.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">reserved</text><path d="M886,651 L982,651" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="886.272" y="639.0" width="95.456" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="934.0" y="655.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">done / failed</text><rect x="60" y="760" width="720" height="113.6" rx="11" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.4" stroke-opacity="0.8"/><text x="76" y="784" font-size="13.2" font-weight="700" fill="#136b74">The bucketed window engine</text><text x="76" y="806" font-size="12.4" fill="#136b74" fill-opacity="0.92">Counters are fixed time buckets: memory is O(buckets), not per event.</text><text x="76" y="824.4" font-size="12.4" fill="#136b74" fill-opacity="0.92">~19.5 KB flat vs ~1 MB for the exact log at 8k in-window events.</text><text x="76" y="842.8" font-size="12.4" fill="#136b74" fill-opacity="0.92">The trailing bucket is prorated; precise=true keeps an exact log.</text><text x="76" y="861.1999999999999" font-size="12.4" fill="#136b74" fill-opacity="0.92">Edge tolerance: admissions stay within cap + one bucket, never unbounded.</text><rect x="800" y="760" width="700" height="113.6" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="816" y="784" font-size="13.2" font-weight="700" fill="#8c5a0d">How the verdict is chosen</text><text x="816" y="806" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">A call must clear every applicable rule at the same time.</text><text x="816" y="824.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">The rule with the longest retry_after trips - the toughest wins.</text><text x="816" y="842.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Denial names the rule and scope, with an exact wait to sleep on.</text><text x="816" y="861.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">~16k decisions/s in Python; P50 ~37 us, P99 ~147 us (three rules).</text><text x="780.0" y="902" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/quota-gate</text></svg>